name: build

on:
  push:
    branches:
      - main
      - 'expansion/**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bison flex g++ gcc-arm-none-eabi git make ninja-build pkg-config python3 wget xz-utils libpng-dev

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: sudo make skrew

      - name: Configure Repo
        run: make configure

      - name: Build Repo
        run: make check

      - name: Verify matching Rev 1 ROM
        run: |
          actual="$(sha1sum "$BUILD/pokeplatinum.us.nds" | cut -d' ' -f1)"
          expected="0862ec35b24de5c7e2dcb88c9eea0873110d755c"
          echo "SHA-1: $actual"
          test "$actual" = "$expected"

      - name: Checkout xMAP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v6
        with:
          path: 'xmap'
          ref: 'xmap'

      - name: Move xMAP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p xmap
          cp "$BUILD"/*.xMAP xmap/platinumus.xMAP
          echo "XMAP_COMMIT_MSG=$( git log --format=%s ${GITHUB_SHA} )" >> $GITHUB_ENV

      - name: Update xMAP
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: EndBug/add-and-commit@v10
        with:
          cwd: "./xmap"
          add: "*.xMAP"
          message: ${{ env.XMAP_COMMIT_MSG }}

      - name: Post error archive
        if: failure()
        continue-on-error: true
        run: tar czf failure.tar.gz "$BUILD"

      - name: Post error upload
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pokeplatinum-failure-${{ github.run_id }}
          path: failure.tar.gz
          retention-days: 1